        <p>진석이가 먹었으면 하는 메뉴를 입력해주세요!</p>
        <form id="suggestion-form" action="https://formspree.io/f/xeengpdd" method="POST">
            <input type="text" name="suggested_menu" id="menu-input" placeholder="예: 위스키, 생맥주, 막스베르스타펜..." required>
            <button type="submit">추천하기</button>
        </form>
        <div id="result-message" class="hidden">
            <p>감사합니다! <span id="suggested-menu"></span> (을)를 저녁 메뉴로 고려해볼게요! 😋</p>
        </div>
    </div>
